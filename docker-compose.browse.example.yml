# Example only (docs/decisions/0029): the web page reader next to the service. Copy, adapt, never commit the
# live files. Three containers and three networks:
#
#   service ──browse-ctl (internal)── browse-gateway ──browse-inner (internal)── browser
#                                           └──────────── egress ─────────────────┘
#                                                            │
#                                                     browse-out ── internet
#
# The browser can reach nothing but the egress proxy (and the gateway, which needs a signature); the
# service is not on the browser's network. Only `egress` is on a network with internet access, and it
# refuses private, operator-owned and non-standard destinations for every connection.
#
# Secrets go only where they are used: BROWSE_SECRET to the service (app.env) and the gateway,
# BROWSER_WS_PATH to the gateway and the browser, nothing to the egress proxy.
services:
  agent-helper:
    # ... as in docker-compose.example.yml, plus:
    networks: [default, browse-ctl]

  browse-gateway:
    build: { context: ., dockerfile: Dockerfile.browser }
    command: ["python", "-m", "agent_helper.browse_gateway"]
    env_file: [browse-gateway.env]
    environment:
      BROWSER_HOST: browser
      EGRESS_PROXY: http://10.250.29.3:3128
    networks: [browse-ctl, browse-inner]
    depends_on: [browser, egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

  browser:
    build: { context: ., dockerfile: Dockerfile.browser }
    command: ["python", "-m", "agent_helper.browser_server"]
    init: true                   # a minimal init as PID 1 reaps Firefox's child processes
    env_file: [browser.env]
    environment:
      EGRESS_PROXY: http://10.250.29.3:3128
    networks: [browse-inner]     # internal only: no route to the LAN, the host or the internet
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256m
      # Firefox writes into HOME at start; nothing a page leaves behind survives a restart.
      - /home/app:uid=10002,mode=0700,noexec,nosuid,nodev,size=64m
    # The browser server ends itself after BROWSER_MAX_LIFETIME_SECONDS (default 6 hours) and the restart
    # policy starts a fresh one, so no browser process lives long (docs/operations.md, "Web page reader").
    shm_size: 512m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 2g
    cpus: 1.5

  egress:
    build: .                     # the service image: the proxy needs only the standard library
    command: ["python", "-m", "agent_helper.egress"]
    env_file: [egress.env]
    environment:
      # Listen only on the browser's network, not on the interface towards the internet.
      EGRESS_LISTEN_HOST: 10.250.29.3
    networks:
      browse-inner:
        ipv4_address: 10.250.29.3
      browse-out: {}
    # A public resolver, never one with a view of the operator's network (the router's, for example).
    # dns:
    #   - <public resolver address>
    #
    # Behind a VPN (to leave through another public address than the operator's own): give this container
    # `network_mode: "service:<vpn>"`, attach browse-inner with the fixed address to the VPN container
    # instead, keep EGRESS_LISTEN_HOST at that address (never 0.0.0.0: that would include the tunnel), and
    # set EGRESS_NO_OWN_ADDRESS=1 only if the VPN's exit address is really not the operator's.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('10.250.29.3', 3128), 2)"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5

networks:
  browse-ctl:
    internal: true
  browse-inner:
    internal: true
    ipam:
      config:
        - subnet: 10.250.29.0/24   # any free subnet; keep the egress address above in line with it
  browse-out: {}                 # the only network with a way out
