name: CI

# Runs on Gitea Actions (main source). The GitHub copy is a mirror: there the jobs run only for a push
# to main, and nothing is pushed to a registry.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  REGISTRY: gitea:3000
  IMAGE: gitea:3000/piefkepaul/agent-helper

jobs:
  test:
    if: github.server_url != 'https://github.com' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    needs: test
    if: github.server_url != 'https://github.com' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # Push only from main on Gitea; pull requests and other branches only build.
      PUSH: ${{ github.server_url != 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      # Builder in the runner's network: resolves the registry by its LAN name, plain HTTP.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."gitea:3000"]
              http = true
              insecure = true

      - name: Log in to the Gitea registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: piefkepaul
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The same pinned digest from AWS's public mirror of the official images: no Docker Hub pull limit,
      # no login or secret needed. No deploy step: the service is updated by hand to a fixed sha- tag.
      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BASE_REGISTRY=public.ecr.aws/docker/library
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
