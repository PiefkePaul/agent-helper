name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same pinned digest from AWS's public mirror of the official images: no Docker Hub pull limit,
      # no login or secret needed.
      - run: docker build --build-arg BASE_REGISTRY=public.ecr.aws/docker/library -t agent-helper:ci .
