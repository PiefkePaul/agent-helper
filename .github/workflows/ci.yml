name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same pinned digest from AWS's public mirror of the official images: no Docker Hub pull limit,
      # no login or secret needed.
      - run: docker build --build-arg BASE_REGISTRY=public.ecr.aws/docker/library -t agent-helper:ci .

  browser-image:
    # The web page reader's image (Dockerfile.browser): fetches the pinned browser build and fingerprint model,
    # so a broken build shows here and not first in deployment (issue #45).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build -f Dockerfile.browser --build-arg BASE_REGISTRY=public.ecr.aws/docker/library
          --secret id=github_token,env=GITHUB_TOKEN -t agent-helper-browser:ci .
        env:
          # The workflow's own short-lived token, only to lift GitHub's anonymous API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker run --rm agent-helper-browser:ci python -m agent_helper.browser_server --check-model
      - name: diagnose (temporary)
        if: always()
        run: |
          docker run --rm agent-helper-browser:ci sh -c 'id; echo HOME=$HOME XDG=$XDG_CACHE_HOME; ls -la /home/app /tmp; ls -la /opt/browser-cache/camoufox | head'
          docker run --rm -e BROWSER_WS_PATH=ci-0123456789abcdef -e EGRESS_PROXY=http://127.0.0.1:9 agent-helper-browser:ci             timeout 25 python -m agent_helper.browser_server 2>&1 | tail -30 || true
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/app/.camoufox:uid=10002,gid=10002,mode=0700             agent-helper-browser:ci sh -c 'ls -la /tmp /home/app; touch /tmp/x && echo tmp-writable; mkdir /tmp/y && echo mkdir-ok'
      # Start the browser server as in production (read-only file system, only /tmp and the profile writable)
      # and make sure the browser comes up and stays up.
      - run: |
          docker run -d --name browser --read-only --tmpfs /tmp --tmpfs /home/app/.camoufox:uid=10002,gid=10002,mode=0700 --shm-size 512m \
            -e BROWSER_WS_PATH=ci-$(openssl rand -hex 16) -e EGRESS_PROXY=http://127.0.0.1:9 \
            agent-helper-browser:ci python -m agent_helper.browser_server
          sleep 30
          docker logs browser
          test "$(docker inspect -f '{{.State.Running}}' browser)" = true
          ! docker logs browser 2>&1 | grep -E "Traceback|Error"
